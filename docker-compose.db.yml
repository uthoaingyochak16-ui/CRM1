name: quantum-communication-db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - quantum_internal
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  quantum_internal:
    name: quantum_internal
    driver: bridge

volumes:
  postgres_data:
