name: quantum-communication

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quantum_user}:${POSTGRES_PASSWORD:-quantum_password}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-quantum_communication}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Super Admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      UPLOAD_DIR: uploads
      # SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      # SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      # SSLCOMMERZ_IS_SANDBOX: ${SSLCOMMERZ_IS_SANDBOX:-true}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-claude-haiku-4-5-20251001}
      AI_API_ENDPOINT: ${AI_API_ENDPOINT:-https://api.anthropic.com}
      AI_API_KEY: ${AI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_HOSTS: ${DOMAIN:-localhost},frontend,backend,localhost,127.0.0.1
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      AUTO_INITIALIZE_DATABASE: "false"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - quantum_internal
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quantum_internal
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  quantum_internal:
    external: true
    name: quantum_internal

volumes:
  uploads_data:
