services:
  backend:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:   
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in your env file}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?Set POSTGRES_DB in your env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your env file}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Super Admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in your env file}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in your env file}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in your production env file}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in your production env file}
      UPLOAD_DIR: uploads
      # SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      # SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      # SSLCOMMERZ_IS_SANDBOX: ${SSLCOMMERZ_IS_SANDBOX:-true}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-claude-haiku-4-5-20251001}
      AI_API_ENDPOINT: ${AI_API_ENDPOINT:-https://api.anthropic.com}
      AI_API_KEY: ${AI_API_KEY:-}
      ENVIRONMENT: production
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in your production env file},frontend,backend,localhost,127.0.0.1
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      AUTO_INITIALIZE_DATABASE: "false"

  frontend:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
